# Ciniva with qBittorrent, Prowlarr and plugins. Every container runs as an unprivileged user with no capabilities and a
# read-only root filesystem. Only Ciniva reads the library; qBittorrent may write only to Downloads.
#
# .env: CINIVA_PLUGIN_SECRET (random, e.g. `openssl rand -hex 32`), PROWLARR_API_KEY (random; same value in
#       prowlarr/config.xml), optionally MEDIA_ROOT, RENDER_GID (stat -c %g /dev/dri/renderD128), CINIVA_UID/CINIVA_GID.
# `docker compose up -d` runs Ciniva alone; `docker compose --profile downloads up -d` adds qBittorrent, Prowlarr and
# the qBittorrent plugin; add `--profile tv` for the Jellyfin bridge (TV apps).

x-hardening: &hardening
  user: "${CINIVA_UID:-1000}:${CINIVA_GID:-1000}"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  ciniva:
    image: ghcr.io/ciniva/ciniva:latest
    build: .
    container_name: ciniva
    restart: unless-stopped
    <<: *hardening
    ports:
      - "8484:8484"
    env_file: .env
    environment:
      CINIVA_MEDIA: /media/Movies,/media/TV,/media/Downloads
    volumes:
      - ./data:/data
      - ${MEDIA_ROOT:-/data/storage/share}/Movies:/media/Movies:ro
      - ${MEDIA_ROOT:-/data/storage/share}/TV:/media/TV:ro
      - ${MEDIA_ROOT:-/data/storage/share}/Downloads:/media/Downloads:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    # Intel / AMD (integrated or discrete): VA-API and Quick Sync.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"
    networks:
      default: {}
      plugins:
        aliases: [ciniva-internal]
    # NVIDIA: needs the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]

  # Library folders are read-only here: qBittorrent can keep seeding them but cannot change or delete them.
  qbittorrent:
    image: ciniva-qbittorrent:5.1.4
    build: docker/qbittorrent
    container_name: qbittorrent
    restart: unless-stopped
    profiles: [downloads]
    <<: *hardening
    ports:
      - "8080:8080"
      - "61464:61464"
      - "61464:61464/udp"
    volumes:
      - ./qbittorrent:/config
      - ${MEDIA_ROOT:-/data/storage/share}/Downloads:${MEDIA_ROOT:-/data/storage/share}/Downloads
      - ${MEDIA_ROOT:-/data/storage/share}/Movies:${MEDIA_ROOT:-/data/storage/share}/Movies:ro
      - ${MEDIA_ROOT:-/data/storage/share}/TV:${MEDIA_ROOT:-/data/storage/share}/TV:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 512
    networks:
      default: {}
      plugins:
        aliases: [qbittorrent-internal]

  prowlarr:
    image: ciniva-prowlarr:2.7.0
    build: docker/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    profiles: [downloads]
    <<: *hardening
    ports:
      - "9696:9696"
    volumes:
      - ./prowlarr:/config
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 512
    networks:
      default: {}
      plugins:
        aliases: [prowlarr-internal]

  # Plugins live on the internal network only: no internet, and only the secrets they need.
  ciniva-qbittorrent:
    image: ciniva-plugin-qbittorrent:0.1.0
    build: plugins/qbittorrent
    container_name: ciniva-qbittorrent
    restart: unless-stopped
    profiles: [downloads]
    <<: *hardening
    environment:
      CINIVA_URL: http://ciniva-internal:8484
      CINIVA_PLUGIN_SECRET: ${CINIVA_PLUGIN_SECRET}
      PLUGIN_URL: http://ciniva-qbittorrent:8090
      QBIT_URL: http://qbittorrent-internal:8080
      PROWLARR_URL: http://prowlarr-internal:9696
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      PATH_MAP: ${MEDIA_ROOT:-/data/storage/share}/Downloads=/media/Downloads
    pids_limit: 128
    networks: [plugins]

  # Jellyfin-compatible API for TV apps (Jellyfin, Swiftfin, Infuse…). Reachable from the LAN on 8096.
  ciniva-jellyfin:
    image: ciniva-plugin-jellyfin:0.1.0
    build: plugins/jellyfin
    container_name: ciniva-jellyfin
    restart: unless-stopped
    profiles: [tv]
    <<: *hardening
    ports:
      - "8096:8096"
    environment:
      CINIVA_URL: http://ciniva-internal:8484
      CINIVA_PLUGIN_SECRET: ${CINIVA_PLUGIN_SECRET}
      PLUGIN_URL: http://ciniva-jellyfin:8096
      PUBLIC_URL: ${JELLYFIN_PUBLIC_URL:-http://localhost:8096}
      SERVER_NAME: Ciniva
    pids_limit: 256
    networks: [default, plugins]

networks:
  # Internal only. qBittorrent lets this subnet use its API without a password
  # (Web UI → "Bypass authentication for clients in whitelisted IP subnets": 172.31.250.0/24).
  plugins:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/24
